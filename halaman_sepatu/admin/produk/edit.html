
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Produk | SOLESTREET</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            margin: 0;
            background: #f8f7f5;
            font-family: Arial, sans-serif;
            color: #222;
        }

        nav {
            background: white;
            padding: 22px 8%;
            border-bottom: 1px solid #eee;
        }

        nav a {
            color: #222;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
        }

        nav span { color: #bd7837; }

        .container {
            max-width: 850px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .subtitle {
            color: #bd7837;
            letter-spacing: 3px;
            font-size: 12px;
            font-weight: bold;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .group { margin-bottom: 18px; }

        .full { grid-column: 1 / -1; }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea { min-height: 100px; }

        .current-image {
            width: 110px;
            height: 110px;
            object-fit: cover;
            display: block;
            margin: 10px 0;
        }

        button, .back {
            padding: 13px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }

        button {
            background: #bd7837;
            color: white;
        }

        .back {
            background: #eee;
            color: #333;
            display: inline-block;
            margin-left: 8px;
        }

        .message {
            background: #f8e2e2;
            color: #a52a2a;
            padding: 12px;
            margin-bottom: 15px;
        }

        @media(max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .full { grid-column: auto; }
        }
    </style>
</head>

<body>

<nav>
    <a href="{{ url_for('dashboard') }}">SOLE<span>STREET.</span></a>
</nav>

<main class="container">

    <p class="subtitle">INVENTORY MANAGEMENT</p>
    <h1>Edit Produk</h1>
    <p>Perbarui informasi produk sepatu kamu.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <div class="card">

        <form method="POST"
              enctype="multipart/form-data"
              action="{{ url_for('edit_produk', id=product.id_produk) }}">

            <div class="grid">

                <div class="group">
                    <label>Nama Produk</label>
                    <input type="text" name="nama_produk"
                           value="{{ product.nama_produk }}" required>
                </div>

                <div class="group">
                    <label>Merek</label>
                    <input type="text" name="merek"
                           value="{{ product.merek }}" required>
                </div>

                <div class="group">
                    <label>Kategori</label>
                    <input type="text" name="kategori"
                           value="{{ product.kategori }}" required>
                </div>

                <div class="group">
                    <label>Ukuran</label>
                    <input type="text" name="ukuran"
                           value="{{ product.ukuran }}" required>
                </div>

                <div class="group">
                    <label>Warna</label>
                    <input type="text" name="warna"
                           value="{{ product.warna }}" required>
                </div>

                <div class="group">
                    <label>Harga (Rp)</label>
                    <input type="number" name="harga"
                           value="{{ product.harga }}" min="0" required>
                </div>

                <div class="group">
                    <label>Stok</label>
                    <input type="number" name="stok"
                           value="{{ product.stok }}" min="0" required>
                </div>

                <div class="group">
                    <label>Foto Produk Baru</label>

                    {% if product.gambar %}
                        <img class="current-image"
                             src="{{ url_for('static', filename='uploads/' + product.gambar) }}"
                             alt="Foto produk">
                    {% endif %}

                    <input type="file" name="gambar"
                           accept=".jpg,.jpeg,.png,.webp">
                </div>

                <div class="group full">
                    <label>Deskripsi</label>
                    <textarea name="deskripsi">{{ product.deskripsi or '' }}</textarea>
                </div>

            </div>

            <button type="submit">Simpan Perubahan</button>

            <a href="{{ url_for('daftar_produk') }}" class="back">
                Batal
            </a>

        </form>

    </div>
</main>

</body>
</html>
